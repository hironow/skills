name: CI

# The same gate as `just check` locally: ruff, ty, the tooling's unit
# tests, the structural audit of every skill, and the README index check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review is not in the default set; without it a draft that is
    # marked ready would not get a run until its next push.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + test + audit
    # Draft pull requests do not run CI; the run starts when the PR is marked
    # ready for review (or on the next push after that).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # uv from the official installer; just via `uv tool` because the ubuntu
      # apt package (1.21) is too old for the recipe syntax used here.
      - name: Install uv and just
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install rust-just

      - name: Sync dev environment
        run: uv sync --locked

      - name: just check
        run: just check
