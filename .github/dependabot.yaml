# Dependabot version updates.
#
# hironow house style (amadeus/tablecodec/dotfiles/firepact): a 7-day cooldown for
# supply-chain hardening -- a routine bump is not proposed until the release has been
# public for a week, so a compromised-then-yanked version is not pulled in on day zero.
# Cooldown applies to version updates only; Dependabot SECURITY updates bypass it.
#
# Each ecosystem is grouped into a single pull request so a week's bumps land together.
#
# Ecosystems in this repository: the python tooling that validates the skills
# (pyproject.toml + uv.lock) and the workflows themselves.
version: 2

# One Dependabot pull request per week for the whole repo (owner ruling
# 2026-09-14): every ecosystem below joins the `weekly` group, whose schedule is
# this repo's slot on a weeknight JST (hub `just dependabot-slot <repo>`) — one CI
# run on the runner pool per repo per week instead of one per ecosystem, and no
# org-wide Monday burst. The per-ecosystem cooldown and labels are unchanged;
# commit-message and open-pull-requests-limit live on the group (Dependabot
# refuses them on the entries).
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "16:36"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

updates:

  - package-ecosystem: "uv"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    cooldown:
      default-days: 7
    labels: ["dependencies", "python"]
  - package-ecosystem: "github-actions"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
