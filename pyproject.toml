[project]
name = "skills-tooling"
version = "0.1.0"
description = "Maintenance tooling for this skills repository: structural audit, README index, version comparison"
readme = "README.md"
requires-python = ">=3.12"
# The scripts are stdlib-only on purpose: anyone who clones the repo can run
# `python3 scripts/audit.py` without syncing an environment.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
    "ty>=0.0.77",
]

[tool.uv]
# Supply-chain quarantine: only resolve distributions that have been public for
# at least 7 days. Declared here (not only in a personal global uv config) so
# every `uv lock` -- local and CI -- reproduces `exclude-newer-span = "P7D"` in
# uv.lock instead of a lock that is valid on one machine and stale on another.
exclude-newer = "7 days"

# ADR 0028 (dotfiles): resolve through the malware-scanning PyPI mirror.
[[tool.uv.index]]
name = "flatt"
url = "https://pypi.flatt.tech/simple/"
default = true

[tool.ruff]
# Only the tooling is Python; the skills themselves may bundle example code
# that is upstream material and is not ours to lint.
include = ["pyproject.toml", "scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# see: https://docs.astral.sh/ruff/rules/
select = [
    "FAST", # FastAPI
    "C90",  # mccabe
    "NPY",  # numpy
    "PD",   # pandas
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "N",    # pep8-naming
    "I",    # isort
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "PLE",  # Pylint errors
    "PLR",  # Pylint refactor
    "UP",   # pyupgrade
    "FURB", # refurb
    "RUF",  # Ruff-specific rules
]
extend-ignore = ["E501", "RUF002", "RUF003"]

# ty (https://github.com/astral-sh/ty) replaces mypy: the uv + ruff + ty trio
# (dotfiles ADR 0044). Same scope as the old mypy block: check scripts/ and
# tests/, resolve the tests' bare `from audit import ...` against scripts/.
[tool.ty.src]
include = ["scripts", "tests"]

[tool.ty.environment]
extra-paths = ["scripts"]

# Warnings fail the gate, as mypy --strict did.
[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
# `scripts/` is not a package; the tests import its modules directly.
pythonpath = ["scripts"]
